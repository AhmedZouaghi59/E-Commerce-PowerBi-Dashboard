version: 2

models:

  - name: dim_customer_dwh
    description: "Dimension clients issue des données RAW Superstore."

    columns:

      - name: customer_id
        description: "Identifiant unique du client."
        tests:
          - not_null
          - unique

      - name: customer_name
        description: "Nom du client."
        tests:
          - not_null

      - name: segment
        description: "Segment client."
        tests:
          - not_null


  - name: dim_product_dwh
    description: "Dimension produits issue des données RAW Superstore."

    columns:

      - name: product_id
        description: "Identifiant unique du produit."
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Nom du produit."
        tests:
          - not_null

      - name: category
        description: "Catégorie du produit."
        tests:
          - not_null

      - name: sub_category
        description: "Sous-catégorie du produit."
        tests:
          - not_null


  - name: dim_location_dwh
    description: "Dimension géographique."

    columns:

      - name: country
        description: "Pays."
        tests:
          - not_null

      - name: city
        description: "Ville."
        tests:
          - not_null

      - name: state
        description: "État ou région administrative."
        tests:
          - not_null

      - name: region
        description: "Région commerciale."
        tests:
          - not_null


  - name: dim_shipping_dwh
    description: "Dimension des modes de livraison."

    columns:

      - name: ship_mode
        description: "Mode de livraison."
        tests:
          - not_null
          - unique


  - name: fact_sales_dwh
    description: "Table de faits des ventes."

    columns:

      - name: row_id
        description: "Identifiant unique de la ligne de vente."
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Identifiant de la commande."
        tests:
          - not_null

      - name: order_date
        description: "Date de commande."
        tests:
          - not_null

      - name: ship_date
        description: "Date d'expédition."
        tests:
          - not_null

      - name: customer_id
        description: "Identifiant du client."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer_dwh')
              field: customer_id

      - name: product_id
        description: "Identifiant du produit."
        tests:
          - not_null
          - relationships:
              to: ref('dim_product_dwh')
              field: product_id

      - name: sales
        description: "Montant de la vente."
        tests:
          - not_null

      - name: quantity
        description: "Quantité vendue."
        tests:
          - not_null

      - name: profit
        description: "Bénéfice."
        tests:
          - not_null